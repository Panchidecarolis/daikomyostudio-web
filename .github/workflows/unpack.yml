name: Unpack (iteración v2)

# Flujo temporal: desempaqueta site-v2*.zip en la rama, lo elimina y verifica el build.
on:
  push:
    branches: ['v2-**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Desempaquetar
        run: |
          shopt -s nullglob
          parts=(site-v2*.zip)
          if [ ${#parts[@]} -eq 0 ]; then echo "Nada para desempaquetar"; exit 0; fi
          for z in "${parts[@]}"; do unzip -o -q "$z"; git rm -q "$z"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898211+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Iteración v2: portada, grilla modular, Estudio, contacto y memorias" -m "Portada con aerea copia.jpg (Cenotafio); cierre con Majlis.jpg (Riyadh). Grilla modular de 8 proyectos. Estudio como ensayo visual con croquis y procesos. Formulario de contacto con Netlify Forms. Cenotafio y Centro de Capacitación actualizados desde sus carpetas; planos de RDV y SFF desde las láminas A1." -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01JtqT6FdnRZmuWpRWPd4u4a"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build de verificación
        run: |
          npm install --no-audit --no-fund
          npm run build
          find dist -name index.html | wc -l
