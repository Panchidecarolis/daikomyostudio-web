name: Bootstrap (desempaquetar el código)

# Flujo de un solo uso: desempaqueta site-part-*.zip en la raíz del repositorio,
# los elimina y verifica el build de producción. Se puede borrar después.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Desempaquetar
        run: |
          shopt -s nullglob
          parts=(site-part-*.zip)
          if [ ${#parts[@]} -eq 0 ]; then echo "Nada para desempaquetar"; exit 0; fi
          for z in "${parts[@]}"; do unzip -o -q "$z"; git rm -q "$z"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898211+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Desempaqueta el código fuente y las imágenes del sitio"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build de verificación
        run: |
          npm install --no-audit --no-fund
          npm run build
          echo "--- páginas generadas ---"
          find dist -name index.html | sort
