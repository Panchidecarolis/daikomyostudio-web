text:
  es:
    - >-
      La propuesta busca equilibrar el carácter racional de la arquitectura existente con una atmósfera cálida e íntima,
      donde lo cotidiano adquiere valor.
    - >-
      Una barra curva de acero inoxidable introduce un gesto de proximidad dentro de la geometría ortogonal, organizando
      un espacio flexible y sin jerarquías. El diálogo entre el hormigón y la madera, junto con las visuales hacia el
      Parque Boronat, construye un lugar donde la arquitectura acompaña el encuentro y el tiempo compartido.
  en:
    - >-
      The proposal seeks to balance the rational character of the existing architecture with a warm, intimate
      atmosphere, where everyday moments acquire meaning.
    - >-
      A curved stainless steel counter introduces a gesture of closeness within the orthogonal geometry, shaping a
      flexible space without hierarchy. The dialogue between concrete and wood, together with views towards Boronat
      Park, creates a place where architecture supports gathering and time spent together.
