text:
  es:
    - >-
      El Cenotafio se erige como un espacio de introspección y memoria en medio del paisaje industrial de Ingeniero White.
    - >-
      Dos semicírculos de acero se entrelazan en un gesto simbólico que evoca un abrazo, buscando contener el duelo de las
      familias y preservar la memoria de quienes ya no están.
    - >-
      El recorrido atraviesa distintos grados de intimidad hasta alcanzar un espacio de silencio y recogimiento, donde la
      materia y las huellas del tiempo construyen una atmósfera de contemplación.
  en:
    - >-
      The Cenotaph stands as a place of introspection and remembrance within the industrial landscape of Ingeniero White.
    - >-
      Two steel semicircles intertwine in a symbolic gesture evoking an embrace, seeking to comfort grieving families and
      preserve the memory of those no longer with us.
    - >-
      The path unfolds through different degrees of intimacy, leading to a space of silence and reflection, where
      material and the traces of time shape an atmosphere of contemplation.
