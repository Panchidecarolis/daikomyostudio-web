text:
  es:
    - >-
      El Cenotafio, en memoria de las víctimas de la explosión del elevador de granos de Ingeniero White, no es una plaza
      ni un parque recreativo: es un monumento dedicado a quienes ya no están, un lugar donde la comunidad se reúne en
      su recuerdo y toma conciencia de la tragedia vivida.
    - >-
      El círculo, símbolo de unidad, del origen de la vida y de la eternidad, da forma al proyecto. Dos semicírculos de
      acero se entrelazan en un gesto que evoca un abrazo: envuelve la memoria de los fallecidos y busca dar consuelo a
      las familias.
    - >-
      El recorrido atraviesa distintos grados de intimidad hasta el espacio central de conmemoración. A la altura de
      los ojos, una serie de textos narra los hechos; en la pieza central se inscriben los nombres y la fecha de cada
      vida perdida. La intención es crear un ambiente de silencio y recogimiento a pesar del ruido de la industria que
      lo rodea.
    - >-
      El acero en proceso de oxidación expresa la capacidad de la memoria de transformarse con el tiempo. Cada pieza se
      distingue por las huellas singulares que la oxidación deja en su superficie: un recordatorio de la pérdida y,
      también, de la fortaleza de una comunidad que se une en el recuerdo.
  en:
    - >-
      The Cenotaph, in memory of the victims of the grain elevator explosion in Ingeniero White, is neither a plaza nor
      a recreational park: it is a monument to those who are no longer here, a place where the community gathers to
      remember them and to keep the tragedy present.
    - >-
      The circle, a symbol of unity, of the origin of life and of eternity, gives the project its form. Two steel
      semicircles intertwine in a gesture that evokes an embrace, enfolding the memory of the victims and seeking to
      comfort their families.
    - >-
      The path moves through different degrees of intimacy towards the central space of remembrance. At eye level, a
      series of texts recounts the events; the central piece bears the name and date of each life lost. The aim is a
      setting of silence and reflection despite the noise of the surrounding industry.
    - >-
      Steel in the process of oxidation expresses memory's capacity to change over time. Each piece is marked by the
      unique traces that oxidation leaves on its surface: a reminder of loss and, also, of the strength of a community
      united in remembrance.
