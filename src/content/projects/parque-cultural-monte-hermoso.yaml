text:
  es:
    - >-
      El Parque Cultural de Monte Hermoso surge del interés por repensar la arquitectura desde la conciencia del lugar,
      entendiendo que toda forma construida responde al territorio que la recibe.
    - >-
      La propuesta no busca imitar el paisaje, sino inscribirse en él. Una arquitectura horizontal y transitable acompaña
      la topografía, prolongando el territorio sobre sus cubiertas y diluyendo los límites entre interior y exterior.
      Un paisaje habitado donde naturaleza, cultura y vida cotidiana encuentran un espacio común.
  en:
    - >-
      The Monte Hermoso Cultural Park emerges from a desire to rethink architecture through an awareness of place,
      recognizing that every built form responds to the territory it inhabits.
    - >-
      Rather than imitating the landscape, the project seeks to become part of it. A horizontal, walkable architecture
      follows the natural topography, extending the terrain across its roofs and blurring the boundaries between inside
      and outside. An inhabited landscape where nature, culture, and everyday life find a common ground.
