text:
  es:
    - >-
      Un viaje hacia los orígenes de la humanidad revela cómo las antiguas civilizaciones encontraron refugio en las
      formaciones rocosas del desierto, donde cuevas y espacios ocultos dieron lugar a distintas formas de habitar.
    - >-
      Five Sense Community reinterpreta esta relación ancestral entre naturaleza y arquitectura, organizando la vida
      colectiva alrededor de un jardín central, donde la sombra, el agua y la luz construyen un lugar de encuentro y
      contemplación.
  en:
    - >-
      A journey into the origins of humanity reveals how ancient civilizations found shelter within the rock formations
      of the desert, where caves and hidden spaces gave rise to different ways of inhabiting.
    - >-
      Five Sense Community reinterprets this ancestral relationship between nature and architecture, organizing
      collective life around a central garden, where shade, water, and light create a place for gathering and
      contemplation.
