text:
  es:
    - >-
      En un entorno portuario e industrial de Ingeniero White, el Centro se emplaza sobre un terreno baldío de 10 × 30 m.
      El suelo, arcilloso y expansivo, sufrió hundimientos y anegamientos que afectaron a la vivienda que existía en el
      lote, y se convierte en la principal condición del diseño estructural.
    - >-
      La búsqueda arquitectónica toma como punto de partida las antiguas viviendas de chapa y madera de los trabajadores
      ferroportuarios de Ingeniero White, cuya construcción liviana respondía a ese mismo suelo y contribuyó a definir la
      identidad del lugar.
    - >-
      El edificio se desarrolla íntegramente en planta baja: 180 m² cubiertos y 120 m² al aire libre, entre un patio de
      ingreso, un patio central de uso colectivo y la expansión de la sala de reuniones. Dos aulas flexibles pueden
      integrarse en un único espacio mediante tabiques móviles; a lo largo de las medianeras se concentran el mobiliario
      fijo y los servicios, y una circulación longitudinal vincula el frente con el fondo.
    - >-
      Una estructura metálica liviana de pórticos independientes sostiene una cubierta inclinada orientada al sur, que
      incorpora luz natural difusa y ventilación cruzada. El sistema liviano absorbe mejor las deformaciones del suelo y
      retoma el carácter industrial del lugar: una arquitectura que encuentra en la memoria del trabajo portuario y
      ferroviario una respuesta para el presente.
  en:
    - >-
      Set in the port and industrial surroundings of Ingeniero White, the Centre occupies a vacant 10 × 30 m plot. The
      expansive clay soil, which had suffered subsidence and flooding that damaged the house previously on the site,
      becomes the main condition for the structural design.
    - >-
      The architectural approach draws from the traditional metal-clad and timber houses of Ingeniero White's railway
      and port workers, whose lightweight construction responded to that same soil and helped shape the identity of the
      place.
    - >-
      The building unfolds entirely on the ground floor: 180 m² indoors and 120 m² of open space, between an entrance
      patio, a shared central courtyard and an extension of the meeting room. Two flexible classrooms can be joined into
      a single space with movable partitions; fixed furniture and services run along the party walls, and a longitudinal
      corridor links the front of the site with the back.
    - >-
      A lightweight steel structure of independent frames supports a south-facing sloping roof that brings in diffuse
      daylight and cross ventilation. The light system better absorbs the movements of the soil and takes up the
      industrial character of the place: an architecture that finds in the memory of port and railway work a response
      to the present.
