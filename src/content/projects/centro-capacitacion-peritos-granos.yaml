text:
  es:
    - >-
      La búsqueda arquitectónica toma como punto de partida las antiguas viviendas de chapa y madera de los trabajadores
      ferroportuarios de Ingeniero White, cuya construcción liviana respondía a las condiciones del suelo arcilloso
      expansivo y contribuyó a definir la identidad del lugar.
    - >-
      Esa misma condición del territorio orienta hoy el proyecto, que reinterpreta aquella lógica constructiva mediante
      una estructura metálica liviana y una sucesión de cubiertas inclinadas que incorporan luz natural. Una arquitectura
      que encuentra en la memoria del lugar una respuesta para el presente.
  en:
    - >-
      The architectural approach draws from the traditional metal-clad and timber houses of Ingeniero White's railway
      and port workers, whose lightweight construction responded to the expansive clay soil and helped shape the
      identity of the place.
    - >-
      That same condition of the land continues to inform the project today, reinterpreting this construction logic
      through a lightweight steel structure and a sequence of sloping roofs that bring natural light into the interior.
      An architecture that finds in the memory of the place a response to the present.
