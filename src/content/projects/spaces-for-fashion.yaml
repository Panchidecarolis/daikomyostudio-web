text:
  es:
    - A orillas del río Cervo, la antigua fábrica Trombetta conserva la memoria industrial de Biella.
    - >-
      Una nueva cubierta entreteje ambos volúmenes en un único conjunto, reinterpretando la geometría de los tejados de la
      ciudad. Una arquitectura que encuentra en el pasado el punto de partida para imaginar el futuro.
  en:
    - Along the banks of the Cervo River, the former Trombetta factory preserves Biella's industrial memory.
    - >-
      A new roof weaves both volumes into a unified whole, reinterpreting the geometry of the city's traditional roofscape.
      An architecture that looks to the past as a starting point for imagining the future.
